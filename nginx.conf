# ============================================================
# 前端静态站点 + 后端反向代理
# ------------------------------------------------------------
# 前端 request.js 的 baseURL 为 /api，图片地址为 /api/files/goods/xxx.jpg，
# 因此这里必须「保留 /api 前缀」转发给后端（后端 context-path 也是 /api）。
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传图片最大 5MB，请求体上限略放宽到 10MB（与后端 max-request-size 一致）
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # ---------- 后端接口与图片 ----------
    # proxy_pass 不带 URI，/api/... 原样转发到后端 /api/...（不 rewrite）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 助手 SSE 流式响应：关闭缓冲、放宽读超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- 静态资源长期缓存 ----------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- Vue Router history 模式 ----------
    # 刷新 /goods/12、/admin 等子路由时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
